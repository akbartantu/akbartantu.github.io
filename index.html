  <footer class="footer"><div class="shell footer-inner"><span><b class="footer-mark">●</b> Digital Career Portfolio · Contributions backed by evidence, not assumptions.</span><span id="footer-right">© 2026 · Selected work</span></div></footer>
  <div class="modal-backdrop hidden" id="modal-container" role="presentation"></div>
  <script>
  (()=>{
    'use strict';
    const PUBLIC_BUILD=document.documentElement.dataset.build==='public';
    const STORAGE_KEY='digital-career-portfolio-v4'; // Isolate newly seeded v3 workspace from v1/v2 browser data
    const clone=o=>JSON.parse(JSON.stringify(o));
    const seed=JSON.parse(document.getElementById('seed-data').textContent);
    let db=clone(seed), route='home', activeProject='', editorTab='profile';
    if(!PUBLIC_BUILD){try{const cached=localStorage.getItem(STORAGE_KEY);if(cached){const parsed=JSON.parse(cached);if(parsed&&Array.isArray(parsed.projects)&&Array.isArray(parsed.evidence))db=parsed;}}catch(e){console.warn('Local workspace could not be loaded',e);}}
    const $=sel=>document.querySelector(sel);
    const el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')n.className=v;else if(k==='text')n.textContent=String(v??'');else if(k.startsWith('data-'))n.setAttribute(k,v);else if(k==='html')n.innerHTML=v;else n.setAttribute(k,v);});(Array.isArray(children)?children:[children]).filter(Boolean).forEach(c=>n.append(c));return n;};
    const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const ICONS={"dashboard":"<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>","shield":"<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"/><path d=\"m9 12 2 2 4-4\"/>","people":"<circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3 20v-2a6 6 0 0 1 12 0v2Z\"/><path d=\"M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5\"/>","graduation":"<path d=\"m2 9 10-5 10 5-10 5L2 9Z\"/><path d=\"M6 11v6c4 3 8 3 12 0v-6M22 9v7\"/>","briefcase":"<rect x=\"3\" y=\"7\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18\"/>","document":"<path d=\"M7 2h7l5 5v15H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z\"/><path d=\"M14 2v6h5M9 13h6M9 17h6\"/>","image":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8\" cy=\"8\" r=\"1\"/><path d=\"m3 16 5-5 4 4 3-3 6 6\"/>","lock":"<rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>","world":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18\"/>","check":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12 3 3 5-6\"/>","chart":"<path d=\"M4 20V4M4 20h16M8 16l4-6 3 3 5-8\"/>","spark":"<path d=\"m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2Z\"/>","code":"<path d=\"m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16\"/>","profile":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>"};const iconSvg=(name='document',size=36)=>`<svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.document}</svg>`;
    const safeIcon=s=>Object.hasOwn(ICONS,s)?s:'document';
    function projectIcon(p){if(Object.hasOwn(ICONS,p.icon))return p.icon;const c=(p.category||'').toLowerCase();if(c.includes('cyber')||c.includes('security'))return 'shield';if(c.includes('teach')||c.includes('mentor')||c.includes('people'))return 'people';if(c.includes('education'))return 'graduation';if(c.includes('digital')||c.includes('innovation'))return 'dashboard';return 'briefcase';}
    const safeImage=s=>typeof s==='string'&&/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s)?s:'';
    const avatar=(p,large=false)=>`<div class="avatar ${large?'avatar-large':''}">${safeImage(p.photoData)&&(!PUBLIC_BUILD||p.photoApproved===true)?`<img src="${escapeHTML(safeImage(p.photoData))}" alt="Foto profil profesional">`:iconSvg('profile',large?56:36)}</div>`;
    const save=()=>{if(PUBLIC_BUILD)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){alert('Penyimpanan browser penuh. Kurangi ukuran gambar atau ekspor backup JSON.');}};
    const visibleProjects=()=>db.projects.filter(p=>!PUBLIC_BUILD||p.visibility==='public');
    const visibleEvidence=p=>db.evidence.filter(e=>e.projectId===p.id&&(!PUBLIC_BUILD||(e.visibility==='public'&&e.approved===true)));
    function navigate(to,id){route=to;activeProject=id||'';window.location.hash=to==='case'?`case/${encodeURIComponent(id)}`:to;render();window.scrollTo({top:0,behavior:'instant'});}
    function headerBlock(title,subtitle=''){return `<div class="section-heading"><div><h2>${escapeHTML(title)}</h2>${subtitle?`<p>${escapeHTML(subtitle)}</p>`:''}</div></div>`;}
    function projectCard(p){const evidence=visibleEvidence(p);return `<article class="card project-card"><div class="card-visual"><span class="visual-glyph">${iconSvg(projectIcon(p),38)}</span><span class="small-kicker">${escapeHTML(p.category)}</span></div><div class="card-main"><span class="small-kicker">${escapeHTML(p.period)}</span><div class="card-title">${escapeHTML(p.title)}</div><p class="card-desc">${escapeHTML(p.summary)}</p><div class="pills">${(p.competencies||[]).slice(0,2).map(c=>`<span class="pill">${escapeHTML(c)}</span>`).join('')}</div><div class="card-foot"><span class="section-note">${evidence.length} evidence to view</span><button class="btn tiny secondary" data-case="${escapeHTML(p.id)}">View case study →</button></div></div></article>`;}

    const cvKinds=[['experience','Experience & Employment'],['education','Education'],['organizations','Organization & Leadership'],['volunteering','Volunteering & Facilitation'],['skills','Skills'],['credentials','Credentials & Learning'],['recognitions','Recognition']];
    const cvData=kind=>Array.isArray(db.cv?.[kind])?db.cv[kind]:[];
    const cvVisible=(kind)=>cvData(kind).filter(x=>!PUBLIC_BUILD||x.visibility==='public');
    function cvEntryView(x){return `<article class="cv-entry"><div class="cv-date">${escapeHTML(x.period||'Periode belum tersedia')}</div><div><h3>${escapeHTML(x.title||'')}</h3><div class="cv-org">${escapeHTML(PUBLIC_BUILD?(x.publicOrganization||x.organization):x.organization)}${x.location?' · '+escapeHTML(x.location):''}</div><p>${escapeHTML(x.summary||'')}</p>${x.details?.length?`<ul>${x.details.map(d=>`<li>${escapeHTML(d)}</li>`).join('')}</ul>`:''}</div></article>`;}
    function cvMiniView(x){return `<article class="cv-mini"><small>${escapeHTML(x.period||'')}</small><strong>${escapeHTML(x.title||'')}</strong><div class="cv-org">${escapeHTML(PUBLIC_BUILD?(x.publicOrganization||x.organization):x.organization)}</div><p>${escapeHTML(x.summary||'')}</p></article>`;}
    function cvGroup(kind,label,mini=false){const arr=cvVisible(kind);if(!arr.length)return '';return `<section class="cv-section" id="cv-${kind}"><div class="cv-head"><h2>${escapeHTML(label)}</h2><small>${arr.length} entries</small></div><div class="${mini?'cv-grid':'timeline'}">${arr.map(mini?cvMiniView:cvEntryView).join('')}</div></section>`;}
    function resumeView(){const p=db.profile;const ss=cvVisible('skills');return `<div class="shell"><section class="hero"><div class="redline"></div><span class="eyebrow">PROFESSIONAL RESUME / DIGITAL CV</span></section><div class="cv-hero"><div class="cv-hero-panel"><div class="hero-profile">${avatar(p,true)}<div><h1 style="font-size:clamp(27px,4vw,43px)">${escapeHTML(p.displayName)}</h1><p class="lead">${escapeHTML(p.headline)}</p></div></div><p style="white-space:pre-line;color:#526079;font-size:14px">${escapeHTML(p.about)}</p>${p.linkedin?`<p><a href="${escapeHTML(safeLinkedin(p.linkedin))}" rel="noopener noreferrer" target="_blank" class="mini-link">LinkedIn profile ↗</a></p>`:''}</div><aside class="cv-hero-aside"><div><span>EXPERIENCE AREAS</span><strong style="display:block;margin:18px 0 10px">Technology, Analytics & People</strong><span>Network operations · Cybersecurity governance · Innovation · Learning facilitation</span></div><span style="margin-top:22px">${escapeHTML(p.location||'Indonesia')} · Detailed evidence in selected case studies</span></aside></div><nav class="cv-shortnav" aria-label="Resume sections">${cvKinds.map(([k,l])=>`<a href="#cv-${k}" data-cv-anchor="${k}">${escapeHTML(l)}</a>`).join('')}</nav>${cvGroup('experience','Professional Experience')}${cvGroup('education','Education')}${cvGroup('organizations','Organizations & Leadership',true)}${cvGroup('volunteering','Volunteering & Facilitation',true)}<section class="cv-section" id="cv-skills"><div class="cv-head"><h2>Skills & Capabilities</h2><small>Tanpa rating proficiency yang tidak terverifikasi</small></div><div class="skill-grid">${ss.map(s=>`<article class="skill-box"><h3>${escapeHTML(s.group)}</h3>${(s.items||[]).map(t=>`<span class="skill-tag">${escapeHTML(t)}</span>`).join('')}<small class="section-note">${escapeHTML(s.note||'')}</small></article>`).join('')}</div></section>${cvGroup('credentials','Credentials & Continuous Learning',true)}${cvGroup('recognitions','Selected Recognition',true)}<section class="cv-section"><div class="feature-panel"><span class="eyebrow">BEYOND THE RESUME</span><h2>Project case studies & supporting evidence</h2><p>Explore selected projects to understand context, contributions, known results, and approval-based evidence.</p><button class="btn red" data-route="projects">Explore Case Studies →</button></div></section></div>`;}
    const safeLinkedin=s=>typeof s==='string'&&/^https:\/\/(?:www\.)?linkedin\.com\/in\/[a-z0-9-]+\/?$/i.test(s)?s:'#';
    function cvEditor(){const kinds=cvKinds;const kind=window.__cvEditKind||'experience';const items=cvData(kind);return `<div class="eyebrow">LOCAL EDITOR / FULL RESUME</div><h2>Resume & Career History</h2><div class="cv-warning"><b>Safety:</b> Local notes and private entries must never enter GitHub Pages. Public entries should be reviewed before export. The HTML public site is not a private database.</div><div class="toolbar" style="flex-wrap:wrap">${kinds.map(([id,label])=>`<button type="button" class="btn ${kind===id?'':'secondary'} tiny" data-cv-kind="${id}">${escapeHTML(label)}</button>`).join('')}</div><div class="toolbar"><button class="btn red" data-cv-add="${kind}">+ Add ${kind==='skills'?'skill group':'entry'}</button></div><div>${items.map(x=>`<div class="cv-admin-row"><div><strong>${escapeHTML(x.title||x.group)}</strong><small>${escapeHTML(x.period||x.items?.join(', ')||'')} · ${escapeHTML(x.visibility||'private')}</small></div><div class="toolbar"><button class="btn secondary tiny" data-cv-edit="${escapeHTML(kind+':'+x.id)}">Edit</button><button class="btn danger tiny" data-cv-delete="${escapeHTML(kind+':'+x.id)}">Delete</button></div></div>`).join('')||'<p class="section-note">No records yet.</p>'}</div></div>`;}
    function cvForm(kind,x){const isSkill=kind==='skills';return `<form id="cv-form" data-kind="${escapeHTML(kind)}" data-id="${escapeHTML(x?.id||'')}"><div class="modal-header"><div><span class="eyebrow">RESUME EDITOR</span><h2>${x?'Edit':'Add'} ${escapeHTML(kind)}</h2></div><button type="button" class="close-x" data-close>×</button></div>${isSkill?`<div class="field"><label>Group name</label><input name="group" value="${escapeHTML(x?.group||'')}" required></div><div class="field"><label>Skills (one per line)</label><textarea name="items">${escapeHTML((x?.items||[]).join('\n'))}</textarea></div><div class="field"><label>Proficiency / scope note</label><textarea name="note">${escapeHTML(x?.note||'')}</textarea></div>`:`<div class="field"><label>Role / degree / activity</label><input name="title" value="${escapeHTML(x?.title||'')}" required></div><div class="field-row"><div class="field"><label>Organization (local)</label><input name="organization" value="${escapeHTML(x?.organization||'')}"></div><div class="field"><label>Organization label on public site</label><input name="publicOrganization" value="${escapeHTML(x?.publicOrganization||'')}"></div></div><div class="field-row"><div class="field"><label>Period</label><input name="period" value="${escapeHTML(x?.period||'')}"></div><div class="field"><label>Location</label><input name="location" value="${escapeHTML(x?.location||'')}"></div></div><div class="field"><label>Summary</label><textarea name="summary">${escapeHTML(x?.summary||'')}</textarea></div><div class="field"><label>Key contributions (one per line)</label><textarea name="details">${escapeHTML((x?.details||[]).join('\n'))}</textarea></div><div class="field"><label>Private verification note (not exported)</label><textarea name="validation">${escapeHTML(x?.validation||'')}</textarea></div>`}<div class="field"><label>Visibility</label><select name="visibility"><option value="private" ${x?.visibility==='private'?'selected':''}>Private</option><option value="public" ${x?.visibility==='public'?'selected':''}>Public candidate</option></select></div><div class="modal-actions"><button class="btn secondary" type="button" data-close>Cancel</button><button class="btn" type="submit">Save entry</button></div></form>`;}
    function cvEdit(kind,id){if(!cvKinds.some(x=>x[0]===kind))return;const x=id?cvData(kind).find(v=>v.id===id):null;openModal(cvForm(kind,x));}

    function homeView(){const p=visibleProjects().slice(0,6);return `<div class="shell"><section class="hero"><div class="redline"></div><span class="eyebrow">DIGITAL CV · CAREER & CONTRIBUTIONS</span><div class="hero-profile">${avatar(db.profile,true)}<div><h1>${escapeHTML(db.profile.displayName)}</h1><p class="lead">${escapeHTML(db.profile.headline)}. Portfolio pengalaman, kontribusi, hasil yang diketahui, dan bukti pendukung.</p></div></div><div class="hero-bottom"><div class="hero-actions"><button class="btn red" data-route="resume">Explore Full Resume →</button><button class="btn secondary" data-route="projects">Selected Projects</button></div><p class="hero-note">Hasil kuantitatif tidak dibuat-buat. Evidence asli hanya ditampilkan setelah disetujui untuk publikasi.</p></div></section><section class="section">${headerBlock('Selected Projects','Choose a case study to see the challenge, my contribution, and the evidence behind it.')}<div class="cards">${p.length?p.map(projectCard).join(''):'<div class="empty">Belum ada proyek yang ditandai Public.</div>'}</div></section><section class="section"><div class="feature-grid"><div class="feature-panel"><span class="eyebrow">HOW TO READ A CASE STUDY</span><h2>From contribution to evidence</h2><div class="steps"><div class="step"><div class="step-no">01</div><div><strong>Challenge & context</strong><span>What problem needed to be solved?</span></div></div><div class="step"><div class="step-no">02</div><div><strong>My actions & decisions</strong><span>What did I personally contribute?</span></div></div><div class="step"><div class="step-no">03</div><div><strong>Results & limitations</strong><span>What happened, and what is not yet measured?</span></div></div><div class="step"><div class="step-no">04</div><div><strong>Supporting materials</strong><span>What can available evidence actually prove?</span></div></div></div></div><div class="feature-panel"><span class="eyebrow">EVIDENCE PRINCIPLE</span><h2>Claims should be verifiable.</h2><p>Every case study distinguishes work produced, adoption, outcomes, and any business impact that can be confirmed.</p><div class="highlight"><span>${iconSvg('check',22)}</span><div><strong>No invented metrics</strong><p>Results without a verified baseline are described qualitatively, with limitations stated clearly.</p></div></div><div class="highlight"><span>${iconSvg('lock',22)}</span><div><strong>Privacy by design</strong><p>Internal documents, customer details, and infrastructure data are not part of the public portfolio.</p></div></div></div></div></section></div>`;}
    function projectsView(){return `<div class="shell"><section class="hero"><div class="redline"></div><span class="eyebrow">CASE STUDY LIBRARY</span><h1>Work Portfolio</h1><p class="lead">Selected work, each structured around the problem, my role, what I did, and supporting outcomes.</p></section><section class="section"><div class="cards">${visibleProjects().map(projectCard).join('')||'<div class="empty">No public projects yet.</div>'}</div></section></div>`;}
    function aboutView(){const p=db.profile;return `<div class="shell"><section class="hero"><div class="redline"></div><span class="eyebrow">ABOUT</span><div class="hero-profile">${avatar(p,true)}<div><h1>${escapeHTML(p.displayName)}</h1><p class="lead">${escapeHTML(p.headline)}</p></div></div></section><div class="feature-grid"><article class="feature-panel"><h2>Professional Summary</h2><p style="white-space:pre-line">${escapeHTML(p.about)}</p></article><aside class="feature-panel"><h2>Details</h2><p><b>Location:</b> ${escapeHTML(p.location||'Not specified')}</p>${p.contact?`<p><b>Contact:</b> ${escapeHTML(p.contact)}</p>`:''}<p class="section-note">Only add contact details you are comfortable publishing.</p></aside></div></div>`;}
    function evidenceTile(e){return `<button class="evidence-tile" data-evidence="${escapeHTML(e.id)}"><div class="evidence-image">${e.imageData?`<img src="${escapeHTML(safeImage(e.imageData))}" alt="Evidence thumbnail">`:iconSvg('image',34)}</div><div class="evidence-copy"><strong>${escapeHTML(e.title)}</strong><span>${escapeHTML(e.explanation||'View the supporting context and the claim it supports.')}</span></div></button>`;}
    function caseView(){const p=visibleProjects().find(x=>x.id===activeProject);if(!p)return `<div class="shell section"><div class="empty">Case study tidak ditemukan atau tidak tersedia untuk publik. <button class="btn tiny secondary" data-route="projects">Back to projects</button></div></div>`;const evidence=visibleEvidence(p);return `<div class="case-header"><div class="shell"><button class="back" style="border:0;background:none;padding:0" data-route="projects">← Back to projects</button><div class="eyebrow">${escapeHTML(p.category)} · ${escapeHTML(p.period)}</div><h1>${escapeHTML(p.title)}</h1><p class="case-summary">${escapeHTML(p.summary)}</p><div class="case-meta"><span class="pill">${escapeHTML(p.role)}</span>${(p.competencies||[]).map(x=>`<span class="pill">${escapeHTML(x)}</span>`).join('')}</div></div></div><div class="shell case-layout"><div><section class="case-panel"><span class="eyebrow">01 / CONTEXT</span><h2>The Challenge</h2><p>${escapeHTML(p.challenge)}</p></section><section class="case-panel"><span class="eyebrow">02 / OWNERSHIP</span><h2>My Contribution</h2><ul>${(p.contributions||[]).map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></section><section class="case-panel"><span class="eyebrow">03 / DELIVERY</span><h2>Approach & Execution</h2><p>${escapeHTML(p.approach)}</p></section><section class="case-panel"><span class="eyebrow">04 / IMPACT</span><h2>Results & Boundaries</h2><p>${escapeHTML(p.results)}</p><div class="muted-box">Evidence is not the same as business impact. Any unmeasured benefit should remain explicitly unquantified.</div></section><section class="case-panel"><span class="eyebrow">05 / EVIDENCE</span><h2>Supporting Materials</h2>${evidence.length?`<div class="evidence-grid">${evidence.map(evidenceTile).join('')}</div>`:'<div class="empty">No approved public evidence has been attached to this case study yet. This does not mean the work was not done; it means supporting files are not currently published.</div>'}</section><section class="case-panel"><span class="eyebrow">06 / REFLECTION</span><h2>Lessons Learned</h2><p>${escapeHTML(p.learning)}</p></section></div><aside class="side-sticky"><div class="case-panel"><div class="side-label">CASE ID</div><div class="side-stat">${escapeHTML(p.id)}</div><div class="side-label">PERIOD</div><div class="side-stat">${escapeHTML(p.period)}</div><div class="side-label">ROLE</div><div class="side-stat">${escapeHTML(p.role)}</div><div class="side-label">RELATED CAPABILITIES</div><div class="pills">${(p.competencies||[]).map(c=>`<span class="pill">${escapeHTML(c)}</span>`).join('')}</div><div class="divider"></div><p class="section-note">Detailed competency / Key Behavior claims are managed separately from the public website. Public labels do not imply formal accreditation or assessment ratings.</p></div></aside></div>`;}
    function showEvidence(id){const e=db.evidence.find(x=>x.id===id);if(!e||PUBLIC_BUILD&&(e.visibility!=='public'||e.approved!==true))return;const p=db.projects.find(x=>x.id===e.projectId);const html=`<div class="modal-header"><div><div class="eyebrow">EVIDENCE DETAIL · ${escapeHTML(e.id)}</div><h2>${escapeHTML(e.title)}</h2></div><button class="close-x" data-close aria-label="Tutup">×</button></div>${e.imageData?`<img class="detail-image" src="${escapeHTML(safeImage(e.imageData))}" alt="Evidence image">`:''}<dl class="definition-list"><dt>Related project</dt><dd>${escapeHTML(p?.title||e.projectId)}</dd><dt>Evidence type</dt><dd>${escapeHTML(e.type||'Not specified')}</dd><dt>What I did</dt><dd>${escapeHTML(e.explanation||'Not specified')}</dd><dt>What this proves</dt><dd>${escapeHTML(e.proves||'Not specified')}</dd><dt>What it does not prove</dt><dd>${escapeHTML(e.limits||'Not specified')}</dd><dt>Date / source</dt><dd>${escapeHTML(e.date||'Date not specified')} · ${escapeHTML(e.source||'Source not specified')}</dd><dt>Review status</dt><dd>${escapeHTML(e.reviewStatus||'Self-reported; not independently validated')}</dd></dl><div class="modal-actions"><button class="btn secondary" data-close>Close</button></div>`;openModal(html);}
    function profileEditor(){return `<div class="eyebrow">LOCAL EDITOR / PROFILE</div><h2>Profile & Home</h2><div class="help">Only put text here that is safe to publish. Profile fields become part of the public export.</div><form id="profile-form"><div class="field"><label for="displayName">Display name / title</label><input name="displayName" id="displayName" required value="${escapeHTML(db.profile.displayName)}"></div><div class="field"><label for="headline">Professional headline</label><input name="headline" id="headline" required value="${escapeHTML(db.profile.headline)}"></div><div class="field"><label for="about">About me</label><textarea name="about" id="about">${escapeHTML(db.profile.about)}</textarea></div><div class="field-row"><div class="field"><label for="location">Location</label><input name="location" id="location" value="${escapeHTML(db.profile.location||'')}"></div><div class="field"><label for="contact">Public contact (optional)</label><input name="contact" id="contact" value="${escapeHTML(db.profile.contact||'')}"></div></div><div class="field"><label for="linkedin">Public LinkedIn URL</label><input name="linkedin" id="linkedin" value="${escapeHTML(db.profile.linkedin||'')}"></div><div class="field"><label for="profile-photo-file">Foto profil (JPG/PNG/WebP, maksimal 700 KB)</label><input id="profile-photo-file" type="file" accept="image/jpeg,image/png,image/webp"><small>Disimpan di browser lokal. Tidak masuk ke website publik kecuali kamu menyetujui publikasinya.</small></div>${safeImage(db.profile.photoData)?`<label class="check-row"><input type="checkbox" id="remove-profile-photo"> Hapus foto yang tersimpan</label>`:""}<label class="check-row"><input type="checkbox" name="photoApproved" value="yes" ${db.profile.photoApproved?"checked":""}> Saya mengizinkan foto profil ini ditampilkan secara publik</label><button class="btn" type="submit">Save profile</button></form>`;}
    function projectEditor(){return `<div class="eyebrow">LOCAL EDITOR / PROJECTS</div><h2>Manage Case Studies</h2><div class="help">Draft projects are saved only in this browser. Only projects marked Public are included in Export Public HTML.</div><div class="toolbar"><button class="btn red" id="add-project">+ Add project</button><button class="btn secondary" data-route="projects">Preview projects</button></div>${db.projects.map(p=>`<div class="editor-row"><div><strong>${escapeHTML(p.title)}</strong><span>${escapeHTML(p.id)} · ${escapeHTML(p.period)} · ${p.visibility==='public'?'🌐 Public candidate':'🔒 Local draft'}</span></div><div class="editor-row-actions"><button class="btn tiny secondary" data-edit-project="${escapeHTML(p.id)}">Edit</button><button class="btn tiny danger" data-delete-project="${escapeHTML(p.id)}">Delete</button></div></div>`).join('')}`;}
    function evidenceEditor(){return `<div class="eyebrow">LOCAL EDITOR / EVIDENCE</div><h2>Evidence Register</h2><div class="help warning"><b>Important:</b> Never upload confidential work files here or publish them through GitHub Pages. Store only approved redacted copies. A reference ID without the underlying confidential file is safer for internal records.</div><div class="toolbar"><button class="btn red" id="add-evidence">+ Add evidence</button></div>${db.evidence.length?db.evidence.map(e=>`<div class="editor-row"><div><strong>${escapeHTML(e.title)}</strong><span>${escapeHTML(e.id)} · ${escapeHTML(e.projectId)} · ${e.visibility==='public'&&e.approved?'✓ Approved public':e.visibility==='public'?'⚠ Public, approval pending':'🔒 Local only'}</span></div><div class="editor-row-actions"><button class="btn tiny secondary" data-edit-evidence="${escapeHTML(e.id)}">Edit</button><button class="btn tiny danger" data-delete-evidence="${escapeHTML(e.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No evidence recorded yet. Add an evidence record and describe what it proves before attaching a safe image.</div>'}`;}
    function mappingEditor(){return `<div class="eyebrow">LOCAL EDITOR / COMPETENCY</div><h2>Competency / KB Mapping</h2><div class="help">Private working notes for assessment preparation. <b>Mapping is intentionally excluded from Public HTML exports</b>; public project tags are only broad capability labels.</div><div class="toolbar"><button class="btn red" id="add-mapping">+ Add mapping</button></div>${(db.mapping||[]).map(m=>`<div class="editor-row"><div><strong>${escapeHTML(m.competency)} · ${escapeHTML(m.kb)}</strong><span>${escapeHTML(m.projectId)} · ${escapeHTML(m.claim)} · ${escapeHTML(m.status)}</span></div><div class="editor-row-actions"><button class="btn tiny secondary" data-edit-mapping="${escapeHTML(m.id)}">Edit</button><button class="btn tiny danger" data-delete-mapping="${escapeHTML(m.id)}">Delete</button></div></div>`).join('')}`;}
    function publishingEditor(){return `<div class="eyebrow">LOCAL EDITOR / EXPORT</div><h2>Backup & Publish</h2><div class="help warning"><b>GitHub Pages is public.</b> Anything embedded in exported HTML (including text and images) can be viewed or saved by visitors. Never put private/confidential materials there. Password-like UI or hidden elements are not access control.</div><div class="feature-panel" style="padding:18px;box-shadow:none;margin-bottom:14px"><h3>1. Backup workspace (private JSON)</h3><p>Saves your current editing state, including private KB mapping and evidence references. Keep it off the public repository.</p><button class="btn secondary" id="backup-json">Download private backup (.json)</button><div style="margin-top:16px" class="field"><label for="restore-json">Restore local JSON backup</label><input id="restore-json" type="file" accept="application/json,.json"><small>Restoring replaces this browser's current workspace after confirmation.</small></div></div><div class="feature-panel" style="padding:18px;box-shadow:none;margin-bottom:14px"><h3>2. Export Public HTML</h3><p>Creates a self-contained static <b>index.html</b> containing only Public project entries and evidence that is both Public and approved. No private mapping data or local draft evidence is included.</p><button class="btn red" id="export-public">Download public index.html</button></div><div class="feature-panel" style="padding:18px;box-shadow:none"><h3>3. Publish via GitHub Pages</h3><p>Put the exported <b>index.html</b> in your GitHub repository root. Configure Pages to deploy from the chosen branch/root. Open the site in a private window and verify that confidential data is absent.</p><div class="privacy-flag">Public export removes draft/private entries; it cannot detect secrets that you manually typed into a public project's text. Review the exported file before committing it.</div></div>`;}
    function editorView(){if(PUBLIC_BUILD)return `<div class="shell section"><div class="empty">This is a public build. Editing is only available in your local source file.</div></div>`;const items=[['profile','Profile'],['cv','Resume Data'],['projects','Projects'],['evidence','Evidence'],['mapping','KB Mapping'],['publishing','Backup & Publish']];const content={profile:profileEditor,cv:cvEditor,projects:projectEditor,evidence:evidenceEditor,mapping:mappingEditor,publishing:publishingEditor};return `<div class="shell editor-layout"><aside class="editor-sidebar"><div class="eyebrow" style="margin-bottom:12px">WORKSPACE</div><div class="editor-menu">${items.map(([id,label])=>`<button data-tab="${id}" class="${editorTab===id?'selected':''}">${label}</button>`).join('')}</div><div class="divider"></div><p class="section-note">Changes are stored in this browser. Export JSON for backup; Export Public HTML for deployment.</p></aside><section class="editor-main">${(content[editorTab]||profileEditor)()}</section></div>`;}
    function render(){const app=$('#app');app.innerHTML=route==='home'?homeView():route==='projects'?projectsView():route==='about'?aboutView():route==='resume'?resumeView():route==='case'?caseView():editorView();document.querySelectorAll('[data-route]').forEach(b=>{if(b.classList.contains('nav-btn'))b.classList.toggle('active',b.dataset.route===route)});$('#editor-trigger').classList.toggle('hidden',PUBLIC_BUILD);$('#editor-banner').classList.toggle('hidden',PUBLIC_BUILD||route!=='editor');document.title=(route==='case'?db.projects.find(x=>x.id===activeProject)?.title+' | ':'')+'Digital Career Portfolio';}
    function openModal(content){const root=$('#modal-container');root.innerHTML=`<div class="modal large" role="dialog" aria-modal="true" aria-label="Details">${content}</div>`;root.classList.remove('hidden');const close=root.querySelector('[data-close]');if(close)close.focus();}
    function closeModal(){$('#modal-container').classList.add('hidden');$('#modal-container').innerHTML='';}
    const fields=form=>Object.fromEntries(new FormData(form).entries());
    const projectForm=p=>`<form id="project-form"><div class="modal-header"><div><span class="eyebrow">PROJECT EDITOR</span><h2>${p?'Edit Case Study':'Add Case Study'}</h2></div><button type="button" class="close-x" data-close>×</button></div><div class="field-row"><div class="field"><label>Project title</label><input name="title" required value="${escapeHTML(p?.title||'')}"></div><div class="field"><label>Period</label><input name="period" placeholder="2024–2025" value="${escapeHTML(p?.period||'')}"></div></div><div class="field-row"><div class="field"><label>Category</label><input name="category" value="${escapeHTML(p?.category||'Digital Innovation')}"></div><div class="field"><label>Ikon proyek</label><select name="icon">${Object.keys(ICONS).filter(k=>!["image","lock","world","check","profile"].includes(k)).map(k=>`<option value="${k}" ${(p?.icon===k)?"selected":""}>${k}</option>`).join("")}</select></div></div><div class="field"><label>Short summary</label><textarea name="summary" required>${escapeHTML(p?.summary||'')}</textarea></div><div class="field"><label>My role</label><input name="role" value="${escapeHTML(p?.role||'')}"></div><div class="field"><label>Challenge / context</label><textarea name="challenge">${escapeHTML(p?.challenge||'')}</textarea></div><div class="field"><label>My specific contributions (one per line)</label><textarea name="contributions" style="min-height:110px">${escapeHTML((p?.contributions||[]).join('\n'))}</textarea></div><div class="field"><label>Approach / decisions</label><textarea name="approach">${escapeHTML(p?.approach||'')}</textarea></div><div class="field"><label>Results & measurement limitations</label><textarea name="results">${escapeHTML(p?.results||'')}</textarea></div><div class="field"><label>Lessons learned</label><textarea name="learning">${escapeHTML(p?.learning||'')}</textarea></div><div class="field"><label>Related competencies (comma-separated, broad labels only)</label><input name="competencies" value="${escapeHTML((p?.competencies||[]).join(', '))}"></div><div class="field"><label>Visibility</label><select name="visibility"><option value="private" ${p?.visibility==='private'?'selected':''}>Private draft (exclude from public export)</option><option value="public" ${p?.visibility==='public'?'selected':''}>Public candidate (included in export)</option></select><small>Review for company/client names, internal details, and overstated metrics before publishing.</small></div><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn" type="submit">Save Case Study</button></div></form>`;
    function editProject(id){const p=id?db.projects.find(x=>x.id===id):null;openModal(projectForm(p));const form=$('#project-form');form.addEventListener('submit',ev=>{ev.preventDefault();const v=fields(form);const obj={id:p?.id||nextId('PORT',db.projects),title:v.title.trim(),period:v.period.trim(),category:v.category.trim(),icon:safeIcon(v.icon),summary:v.summary.trim(),role:v.role.trim(),challenge:v.challenge.trim(),contributions:v.contributions.split('\n').map(x=>x.trim()).filter(Boolean),approach:v.approach.trim(),results:v.results.trim(),learning:v.learning.trim(),competencies:v.competencies.split(',').map(x=>x.trim()).filter(Boolean),visibility:v.visibility};if(p)Object.assign(p,obj);else db.projects.push(obj);save();closeModal();render();});}
    function evidenceForm(e){const options=db.projects.map(p=>`<option value="${escapeHTML(p.id)}" ${e?.projectId===p.id?'selected':''}>${escapeHTML(p.id+' · '+p.title)}</option>`).join('');return `<form id="evidence-form"><div class="modal-header"><div><span class="eyebrow">EVIDENCE RECORD</span><h2>${e?'Edit Evidence':'Add Evidence'}</h2></div><button type="button" class="close-x" data-close>×</button></div><div class="help warning">Use only an image or file that you have permission to publish. No confidential documents, passwords, internal names, infrastructure diagrams, or personal data.</div><div class="field"><label>Related project</label><select name="projectId" required>${options}</select></div><div class="field-row"><div class="field"><label>Evidence title</label><input name="title" required value="${escapeHTML(e?.title||'')}"></div><div class="field"><label>Evidence type</label><select name="type">${['Screenshot','Document reference','Photo','Meeting record','Feedback','Other'].map(x=>`<option ${e?.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>What I did / what visitor sees</label><textarea name="explanation">${escapeHTML(e?.explanation||'')}</textarea></div><div class="field"><label>What this evidence proves</label><textarea name="proves">${escapeHTML(e?.proves||'')}</textarea></div><div class="field"><label>What this evidence does NOT prove</label><textarea name="limits">${escapeHTML(e?.limits||'')}</textarea></div><div class="field-row"><div class="field"><label>Date</label><input name="date" placeholder="2025-06" value="${escapeHTML(e?.date||'')}"></div><div class="field"><label>Source / approved reference</label><input name="source" value="${escapeHTML(e?.source||'')}"></div></div><div class="field"><label>Review / verification status</label><input name="reviewStatus" value="${escapeHTML(e?.reviewStatus||'Self-reported; not independently validated')}"></div><div class="field"><label>Optional approved image (JPEG, PNG, WebP; max 1 MB)</label><input type="file" id="evidence-image-file" accept="image/jpeg,image/png,image/webp"><small>Image is embedded in local storage and in the public export only if approved. Browser storage capacity is limited.</small></div>${e?.imageData?'<label class="check-row"><input id="remove-image" type="checkbox"> Remove existing image</label>':''}<div class="field"><label>Visibility</label><select name="visibility"><option value="private" ${e?.visibility==='private'?'selected':''}>Local only — exclude from public HTML</option><option value="public" ${e?.visibility==='public'?'selected':''}>Public candidate</option></select></div><label class="check-row"><input type="checkbox" name="approved" value="yes" ${e?.approved?'checked':''}> I confirm this evidence and text are cleared for public release</label><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn" type="submit">Save Evidence</button></div></form>`;}
    function editEvidence(id){const e=id?db.evidence.find(x=>x.id===id):null;if(!db.projects.length){alert('Add a project first.');return;}openModal(evidenceForm(e));$('#evidence-form').addEventListener('submit',async ev=>{ev.preventDefault();const form=ev.currentTarget,v=fields(form);let imageData=e?.imageData||'';if($('#remove-image')?.checked)imageData='';const img=$('#evidence-image-file').files[0];if(img){if(img.size>1048576){alert('File exceeds 1 MB. Resize or compress it before attaching.');return;}if(!['image/jpeg','image/png','image/webp'].includes(img.type)){alert('Only JPEG, PNG, and WebP images are supported.');return;}imageData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(img);});}const obj={id:e?.id||nextId('EVD',db.evidence),projectId:v.projectId,title:v.title.trim(),type:v.type,explanation:v.explanation.trim(),proves:v.proves.trim(),limits:v.limits.trim(),date:v.date.trim(),source:v.source.trim(),reviewStatus:v.reviewStatus.trim(),visibility:v.visibility,approved:v.approved==='yes',imageData};if(e)Object.assign(e,obj);else db.evidence.push(obj);save();closeModal();render();});}
    function mappingForm(m){return `<form id="mapping-form"><div class="modal-header"><div><span class="eyebrow">PRIVATE COMPETENCY NOTES</span><h2>${m?'Edit Mapping':'Add Mapping'}</h2></div><button type="button" class="close-x" data-close>×</button></div><div class="field"><label>Portfolio item</label><select name="projectId">${db.projects.map(p=>`<option value="${escapeHTML(p.id)}" ${m?.projectId===p.id?'selected':''}>${escapeHTML(p.id+' · '+p.title)}</option>`).join('')}</select></div><div class="field-row"><div class="field"><label>Competency</label><input name="competency" required value="${escapeHTML(m?.competency||'')}"></div><div class="field"><label>Key Behavior</label><input name="kb" required placeholder="KB2" value="${escapeHTML(m?.kb||'')}"></div></div><div class="field"><label>Specific claim / behavior</label><textarea name="claim">${escapeHTML(m?.claim||'')}</textarea></div><div class="field"><label>Evidence IDs (comma-separated)</label><input name="evidenceIds" value="${escapeHTML((m?.evidenceIds||[]).join(', '))}"></div><div class="field"><label>Proof gap / verification status</label><textarea name="status">${escapeHTML(m?.status||'Not verified')}</textarea></div><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn" type="submit">Save Mapping</button></div></form>`;}
    function editMapping(id){if(!db.projects.length)return alert('Add a project first.');const m=id?db.mapping.find(x=>x.id===id):null;openModal(mappingForm(m));$('#mapping-form').addEventListener('submit',ev=>{ev.preventDefault();const v=fields(ev.currentTarget);const obj={id:m?.id||nextId('MAP',db.mapping),projectId:v.projectId,competency:v.competency.trim(),kb:v.kb.trim(),claim:v.claim.trim(),evidenceIds:v.evidenceIds.split(',').map(x=>x.trim()).filter(Boolean),status:v.status.trim()};if(m)Object.assign(m,obj);else db.mapping.push(obj);save();closeModal();render();});}
    const nextId=(prefix,arr)=>{let i=1;const used=new Set(arr.map(x=>x.id));while(used.has(`${prefix}-${String(i).padStart(3,'0')}`))i++;return `${prefix}-${String(i).padStart(3,'0')}`;};
    function download(filename,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
    function publicExport(){const publicProfile={displayName:db.profile.displayName||'',headline:db.profile.headline||'',about:db.profile.about||'',contact:db.profile.contact||'',location:db.profile.location||'',linkedin:safeLinkedin(db.profile.linkedin||''),photoData:db.profile.photoApproved===true?safeImage(db.profile.photoData):'',photoApproved:db.profile.photoApproved===true};const safe={profile:publicProfile,projects:clone(db.projects.filter(p=>p.visibility==='public').map(p=>({id:p.id,title:p.title,period:p.period,category:p.category,icon:projectIcon(p),summary:p.summary,role:p.role,challenge:p.challenge,contributions:p.contributions,approach:p.approach,results:p.results,learning:p.learning,competencies:p.competencies,visibility:'public'}))),evidence:clone(db.evidence.filter(e=>e.visibility==='public'&&e.approved===true&&db.projects.some(p=>p.id===e.projectId&&p.visibility==='public')).map(e=>({...e,imageData:safeImage(e.imageData)}))),mapping:[],cv:Object.fromEntries(cvKinds.map(([kind])=>[kind,clone(cvVisible(kind).map(item=>kind==='skills'?{id:item.id,group:item.group,items:item.items,note:item.note,visibility:'public'}:{id:item.id,kind:item.kind,title:item.title,organization:item.publicOrganization||item.organization,publicOrganization:item.publicOrganization||item.organization,period:item.period,location:item.location,summary:item.summary,details:item.details,visibility:'public'}))]))};const page=clonePage(safe);download('index.html',page,'text/html;charset=utf-8');}
    function clonePage(data){const snapshot=document.documentElement.cloneNode(true);snapshot.dataset.build='public';snapshot.querySelector('#app').replaceChildren();snapshot.querySelector('#modal-container').replaceChildren();snapshot.querySelector('#editor-banner').classList.add('hidden');snapshot.querySelector('#seed-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');return '<!doctype html>\n'+snapshot.outerHTML;}
    document.addEventListener('click',ev=>{const t=ev.target.closest('[data-cv-kind],[data-cv-add],[data-cv-edit],[data-cv-delete],[data-route],[data-case],[data-tab],[data-evidence],[data-close],[data-edit-project],[data-delete-project],[data-edit-evidence],[data-delete-evidence],[data-edit-mapping],[data-delete-mapping],#editor-trigger,#add-project,#add-evidence,#add-mapping,#backup-json,#export-public');if(!t)return;if(t.hasAttribute('data-cv-kind')){window.__cvEditKind=t.dataset.cvKind;render();}else if(t.hasAttribute('data-cv-add'))cvEdit(t.dataset.cvAdd,null);else if(t.hasAttribute('data-cv-edit')){const [kind,id]=t.dataset.cvEdit.split(':');cvEdit(kind,id);}else if(t.hasAttribute('data-cv-delete')){const [kind,id]=t.dataset.cvDelete.split(':');if(confirm('Delete this resume entry?')){db.cv[kind]=cvData(kind).filter(x=>x.id!==id);save();render();}}else if(t.hasAttribute('data-route'))navigate(t.dataset.route);else if(t.hasAttribute('data-case'))navigate('case',t.dataset.case);else if(t.hasAttribute('data-tab')){editorTab=t.dataset.tab;render();}else if(t.hasAttribute('data-evidence'))showEvidence(t.dataset.evidence);else if(t.hasAttribute('data-close'))closeModal();else if(t.id==='editor-trigger'){if(PUBLIC_BUILD)return;navigate('editor');}else if(t.id==='add-project')editProject(null);else if(t.hasAttribute('data-edit-project'))editProject(t.dataset.editProject);else if(t.hasAttribute('data-delete-project')){if(confirm('Delete this project and its evidence/mapping records?')){const id=t.dataset.deleteProject;db.projects=db.projects.filter(x=>x.id!==id);db.evidence=db.evidence.filter(x=>x.projectId!==id);db.mapping=db.mapping.filter(x=>x.projectId!==id);save();render();}}else if(t.id==='add-evidence')editEvidence(null);else if(t.hasAttribute('data-edit-evidence'))editEvidence(t.dataset.editEvidence);else if(t.hasAttribute('data-delete-evidence')){if(confirm('Delete this evidence record?')){db.evidence=db.evidence.filter(x=>x.id!==t.dataset.deleteEvidence);save();render();}}else if(t.id==='add-mapping')editMapping(null);else if(t.hasAttribute('data-edit-mapping'))editMapping(t.dataset.editMapping);else if(t.hasAttribute('data-delete-mapping')){if(confirm('Delete this KB mapping?')){db.mapping=db.mapping.filter(x=>x.id!==t.dataset.deleteMapping);save();render();}}else if(t.id==='backup-json')download('digital_cv_private_backup.json',JSON.stringify(db,null,2),'application/json');else if(t.id==='export-public')publicExport();});
    document.addEventListener('submit',async ev=>{if(ev.target.id==='cv-form'){ev.preventDefault();const f=ev.target,v=fields(f),kind=f.dataset.kind,id=f.dataset.id;const prev=id?cvData(kind).find(x=>x.id===id):null;const obj=kind==='skills'?{id:id||nextId('SK',cvData(kind)),group:v.group.trim(),items:v.items.split('\n').map(x=>x.trim()).filter(Boolean),note:v.note.trim(),visibility:v.visibility}:{id:id||nextId(kind.toUpperCase().slice(0,3),cvData(kind)),kind:kind==='experience'?'work':kind,title:v.title.trim(),organization:v.organization.trim(),publicOrganization:v.publicOrganization.trim(),period:v.period.trim(),location:v.location.trim(),summary:v.summary.trim(),details:v.details.split('\n').map(x=>x.trim()).filter(Boolean),validation:v.validation.trim(),visibility:v.visibility};db.cv=db.cv||{};db.cv[kind]=cvData(kind);if(prev)Object.assign(prev,obj);else db.cv[kind].push(obj);save();closeModal();render();return;}if(ev.target.id==='profile-form'){ev.preventDefault();const v=fields(ev.target);let photoData=db.profile.photoData||'';if($('#remove-profile-photo')?.checked)photoData='';const file=$('#profile-photo-file')?.files[0];if(file){if(file.size>716800||!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('Gunakan JPG, PNG, atau WebP maksimal 700 KB.');return;}photoData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});if(!safeImage(photoData)){alert('Format foto tidak didukung.');return;}}db.profile={...db.profile,...v,photoData,photoApproved:v.photoApproved==='yes'};save();render();alert('Profil tersimpan di browser ini. Gunakan Export Public HTML jika ingin menerbitkan perubahan.');}});
    document.addEventListener('change',async ev=>{if(ev.target.id!=='restore-json')return;const file=ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.profile||!Array.isArray(data.projects)||!Array.isArray(data.evidence)||!Array.isArray(data.mapping))throw Error('Invalid format');if(!confirm('Replace this local workspace with the backup?'))return;db=data;save();render();alert('Private backup restored locally.');}catch(e){alert('Could not import backup JSON: '+e.message);}});
    $('#modal-container').addEventListener('click',ev=>{if(ev.target===$('#modal-container'))closeModal();});document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();});
    const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('case/')){route='case';activeProject=hash.slice(5);}else if(['home','about','resume','projects','editor'].includes(hash)){route=hash;}if(PUBLIC_BUILD&&route==='editor')route='home';
    window.addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('cv-')){const target=document.getElementById(h);if(target)target.scrollIntoView({behavior:'smooth'});return;}if(h.startsWith('case/')){route='case';activeProject=h.slice(5);}else if(['home','about','resume','projects','editor'].includes(h)){route=PUBLIC_BUILD&&h==='editor'?'home':h;}render();});
    render();
  })();
  </script>
